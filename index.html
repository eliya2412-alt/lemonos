<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LemonVM — Virtual Machines</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="grid-overlay"></span>
  </div>

  <div class="appwin" id="app">
    <header class="toolbar">
      <div class="traffic" aria-hidden="true">
        <span class="tl close"></span><span class="tl min"></span><span class="tl max"></span>
      </div>
      <button class="icon-btn" id="sidebarToggle" title="סרגל צד">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="tb-title">
        <span class="tb-strong" id="libTitle">Virtual Machines</span>
        <span class="pill" id="libCount">0</span>
      </div>
      <div class="tb-spacer"></div>
      <label class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="text" placeholder="חיפוש מכונה…" autocomplete="off" />
        <kbd>⌘K</kbd>
      </label>
      <div class="segmented" id="viewToggle" role="tablist">
        <button data-view="grid" class="active" title="גלריה">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="2" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="2" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="2" fill="currentColor"/></svg>
        </button>
        <button data-view="list" title="רשימה">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="4" width="18" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="10.5" width="18" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="17" width="18" height="3" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
      <button class="btn accent" id="newVmBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        New VM
      </button>
    </header>

    <div class="appbody">
      <aside class="sidebar" id="sidebar">
        <div class="side-scroll">
          <div class="side-label">ספרייה</div>
          <nav class="cat-list" id="catList"></nav>
          <div class="side-label">אחסון</div>
          <div class="storage">
            <div class="storage-bar"><span id="storageFill"></span></div>
            <div class="storage-text"><span id="storageUsed">0 GB</span><span>512 GB</span></div>
          </div>
          <div class="side-label">היפרוויזר</div>
          <div class="hv-card">
            <div class="hv-dot"></div>
            <div>
              <div class="hv-name">LemonVZ</div>
              <div class="hv-sub">Virtualization · Web</div>
            </div>
          </div>
        </div>
        <div class="side-foot">
          <div class="user-chip">
            <span class="avatar-sm">🍋</span>
            <div><div class="u-name">lemon</div><div class="u-sub">מקומי · לא מסונכרן</div></div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-head">
          <div>
            <h1 id="contentTitle">כל המכונות</h1>
            <p id="contentSub">בחר מכונה כדי להפעיל, להגדיר או למחוק</p>
          </div>
        </div>
        <div class="gallery grid" id="gallery"></div>
      </main>

      <aside class="inspector" id="inspector"></aside>
    </div>

    <footer class="statusbar">
      <span id="statusLeft">LemonVM 2.0</span>
      <span class="sb-spacer"></span>
      <span id="statusMid"></span>
      <span class="sb-spacer"></span>
      <span id="statusRight"></span>
    </footer>
  </div>

  <div id="vmLayer" class="vm-layer"></div>

  <div class="modal hidden" id="modal">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
